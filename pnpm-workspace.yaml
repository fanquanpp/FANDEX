# =============================================================================
# FANDEX pnpm workspace 配置
# =============================================================================
# 三端应用 + 共享层 + 工具链 + 第三方组件 + 文档
# 使用 catalog 统一管理核心依赖版本（pnpm 9+ Catalogs 特性）
# =============================================================================

packages:
  # 三端应用（Android 为纯 Gradle 工程，不参与 pnpm workspace）
  - 'app-web'
  - 'app-desktop'
  - 'app-desktop-portable'
  # 共享层（含子包）
  - 'shd-shared'
  - 'shd-shared/tokens'
  - 'shd-shared/utl-utils'
  - 'shd-shared/assets'
  # 工具链
  - 'tls-tools'
  # 第三方组件插件（引入实际第三方包时再在此登记对应子目录）
  # dcs-docs/ 不纳入 workspace

  # -----------------------------------------------------------------------------
  # Catalog：核心依赖版本统一管理
  # 各子包通过 "catalog:" 协议引用，确保版本一致
  # -----------------------------------------------------------------------------
catalog:
  # 框架核心
  astro: ^7.3.1
  react: ^19.0.0
  react-dom: ^19.0.0
  '@astrojs/react': ^6.0.5
  '@astrojs/mdx': ^8.0.0
  '@astrojs/rss': ^4.0.19
  '@astrojs/sitemap': ^3.7.4
  '@astrojs/check': ^0.9.10

  # Tauri 2（desktop 专属，桌面端仅消费 CLI）
  '@tauri-apps/cli': ^2.0.0

  # 样式与 UI
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tailwindcss/typography': ^0.5.20
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0

  # 状态管理与数据
  zod: ^4.5.4

  # 动画
  motion: ^11.0.0

  # Radix UI（React 组件库，web/desktop 共享）
  '@radix-ui/react-accordion': ^1.2.0
  '@radix-ui/react-dialog': ^1.1.0
  '@radix-ui/react-dropdown-menu': ^2.1.0
  '@radix-ui/react-label': ^2.1.0
  '@radix-ui/react-popover': ^1.1.0
  '@radix-ui/react-progress': ^1.1.0
  '@radix-ui/react-scroll-area': ^1.2.0
  '@radix-ui/react-separator': ^1.1.0
  '@radix-ui/react-slot': ^1.1.0
  '@radix-ui/react-tabs': ^1.1.0
  '@radix-ui/react-toggle': ^1.1.0
  '@radix-ui/react-toggle-group': ^1.1.0
  '@radix-ui/react-tooltip': ^1.1.0

  # 内容处理
  gray-matter: ^4.0.3
  shiki: ^4.4.3
  katex: ^0.16.47
  unified: ^11.0.5
  remark-parse: ^11.0.0
  rehype-autolink-headings: ^7.1.0
  rehype-katex: ^7.0.1
  rehype-slug: ^6.0.0
  '@astrojs/markdown-remark': ^7.3.0
  remark-emoji: ^5.0.2
  remark-math: ^6.0.0
  unist-util-visit: ^5.1.0

  # 图标（偏差报备：搜索功能已删除，fuse.js/pagefind/astro-pagefind 一并移除）
  lucide-react: ^0.460.0

  # 工具链
  typescript: ^5.7.0
  tsx: ^4.19.2
  vite: ^6.0.0
  '@vitejs/plugin-react': ^4.3.0
  rollup-plugin-visualizer: ^7.0.1

  # 类型定义
  '@types/node': '^22.0.0'
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  '@types/hast': ^3.0.5
  '@types/mdast': ^4.0.4

  # 其他
  glob: ^13.0.6
  fast-glob: ^3.3.3
  commander: ^12.1.0
  ajv: ^8.17.1
  ajv-formats: ^3.0.1
  web-vitals: ^5.3.0

# -----------------------------------------------------------------------------
# pnpm 11+ 设置（从 .npmrc 与 package.json pnpm 字段迁移）
# -----------------------------------------------------------------------------
# pnpm 11 变更：
# - .npmrc 仅处理认证/注册表设置，其余设置必须在此文件配置
# - package.json 的 pnpm 字段不再被读取
# - onlyBuiltDependencies/neverBuiltDependencies 已移除，替换为 allowBuilds 映射
# - strictDepBuilds 默认 true（未批准的构建脚本会导致安装失败）

# 依赖安装行为
autoInstallPeers: true              # 自动安装 peer 依赖
strictPeerDependencies: false        # 放宽 peer 冲突，避免版本组合时构建中断
shamefullyHoist: false              # 不向上提升依赖，保持严格隔离安装
nodeLinker: isolated                # 使用 isolated 链接器（pnpm 推荐做法）

# 构建脚本批准列表（pnpm 11 新机制，替代旧 onlyBuiltDependencies）
# 仅以下包允许执行 install/postinstall 脚本，其余包的构建脚本将被静默跳过
allowBuilds:
  esbuild: true                     # 需要下载平台原生二进制文件
  sharp: true                       # desktop 端图像处理需要原生模块
  '@tailwindcss/oxides': true       # Tailwind 4 原生引擎

# 将未批准的构建脚本降级为警告（不阻断 CI 安装）
# 配合 allowBuilds 使用：已批准的正常执行，未批准的静默跳过
strictDepBuilds: false

# -----------------------------------------------------------------------------
# 依赖覆盖（pnpm 11：overrides 位于 pnpm-workspace.yaml，package.json 已弃用）
# -----------------------------------------------------------------------------
# brace-expansion：强制 >=5.0.8，修复 DoS 漏洞（GHSA-mh99-v99m-4gvg）
# 传递链路：app-web > glob > minimatch > brace-expansion
overrides:
  brace-expansion: ^5.0.8
