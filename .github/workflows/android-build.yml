# =============================================================================
# FANDEX Android 双端构建校验工作流
# =============================================================================
# 触发时机：
#   1. push 到 main 分支（Android 工程 / 内容源 / 共享层 / 工作流文件变更时）
#   2. 指向 main 的 PR（与 push 相同的路径过滤，PR 阶段即可发现构建回归）
#   3. 手动触发
#
# 职责：调用 android-build-reusable.yml 完成双端构建校验，
#       产物保留 14 天，不创建 Release（发布见 android-release.yml）。
# =============================================================================

name: Android Build Check

on:
  push:
    branches: [main]
    paths:
      - 'app-Android-new/**'
      - 'app-Android-old/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/android-build-reusable.yml'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-Android-new/**'
      - 'app-Android-old/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/android-build-reusable.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android 双端构建校验
    uses: ./.github/workflows/android-build-reusable.yml
    with:
      retention-days: 14
    secrets: inherit
