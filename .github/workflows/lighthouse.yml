
name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - 'app-web/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.npmrc'
      - 'scripts/**'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-web/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.npmrc'
      - 'scripts/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # mermaid-dual 缓存持久化（第 2 期 S5）：本工作流不装 Playwright Chromium，
      # pnpm build:web 内部首步 render-mermaid 与构建期插件（rehype-mermaid-dual）
      # 在无浏览器环境下只做缓存直读——未命中时批次失败被兜底吞掉、插件整体跳过，
      # mermaid 块退化为客户端动态渲染，Lighthouse 会量到退化页。key 与 deploy.yml
      # 同构（sha 级 + 前缀回退），两条工作流共享同一份渲染缓存。
      - name: Restore mermaid render cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mermaid-dual
          key: mermaid-${{ github.sha }}
          restore-keys: mermaid-

      - name: Sync content
        run: pnpm --filter @fandex/web sync

      - name: Generate build stats baseline
        run: pnpm --filter @fandex/web exec node scripts/build-stats.mjs

      - name: Build web project
        run: pnpm build:web

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: app-web/lighthouserc.json
