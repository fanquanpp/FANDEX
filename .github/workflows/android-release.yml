# =============================================================================
# FANDEX Android 双端发布工作流
# =============================================================================
# 触发时机：
#   1. push v* 标签 → 自动构建并发布 GitHub Release
#   2. 手动触发（release=true） → 构建并发布指定标签的 Release
#
# 职责：三端并行构建（Android 双端 APK + Windows 桌面端 NSIS 安装包），
#       统一命名后创建 GitHub Release 并附带全部安装包。
#
# 签名策略：
#   未注入正式 keystore 时回退 debug 签名，CI 可直接出包；
#   debug keystore 在 runner 上临时生成，仅用于分发安装，不做覆盖升级。
# =============================================================================

name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '构建并发布 Release（true 时需要当前提交有对应 v 前缀标签）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: new
            label: 新技术栈
            app: app-Android-new
            sync: node app-Android-new/scripts/generate-content.mjs
            apk: app-Android-new/app/build/outputs/apk/release/app-release.apk
            artifact: fandex-new-apk
          - id: old
            label: 旧技术栈
            app: app-Android-old
            sync: node app-Android-old/scripts/generate-legacy-content.mjs
            apk: app-Android-old/app/build/outputs/apk/release/FANDEX-*.apk
            artifact: fandex-old-apk
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步内容资产（${{ matrix.label }}）
        run: ${{ matrix.sync }}

      - name: 构建 Release APK
        working-directory: ${{ matrix.app }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.apk }}
          retention-days: 90

  desktop:
    name: 构建 Windows 桌面端安装包
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4

      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app-desktop/src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 桌面端构建（web 产物 + playground 剔除 + Tauri 打包）
        run: pnpm --filter @fandex/desktop exec tauri build

      - name: 前端实验室剔除校验
        shell: pwsh
        run: |
          if (Test-Path "app-web/dist/playground") {
            Write-Error "playground 页面未被剔除：桌面端不得包含在线编程功能"
            exit 1
          }
          Write-Host "playground 已剔除，校验通过"

      - name: 上传安装包构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fandex-desktop-installer
          path: app-desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 90

      - name: 构建便携版（免安装解压即用）
        run: pnpm --filter @fandex/desktop-portable build

      - name: 上传便携版构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fandex-desktop-portable
          path: app-desktop-portable/dist/*.zip
          retention-days: 90

  release:
    name: 发布 GitHub Release
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库（读取 CHANGELOG 生成发布说明）
        uses: actions/checkout@v4

      - name: 下载新技术栈 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: fandex-new-apk
          path: apk-new

      - name: 下载旧技术栈 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: fandex-old-apk
          path: apk-old

      - name: 下载 Windows 桌面端安装包产物
        uses: actions/download-artifact@v4
        with:
          name: fandex-desktop-installer
          path: desktop

      - name: 下载 Windows 桌面端便携版产物
        uses: actions/download-artifact@v4
        with:
          name: fandex-desktop-portable
          path: desktop-portable

      - name: 重命名为发布文件名
        run: |
          mkdir -p apk
          mv apk-new/*.apk "apk/FANDEX-${{ github.ref_name }}.apk"
          mv apk-old/*.apk "apk/FANDEX-Legacy-${{ github.ref_name }}.apk"
          mv desktop/*.exe "apk/FANDEX-Setup-${{ github.ref_name }}.exe"
          mv desktop-portable/*.zip "apk/FANDEX-Portable-${{ github.ref_name }}.zip"
          ls -la apk/

      - name: 生成发布说明
        id: notes
        run: |
          # 优先取 CHANGELOG.md 中对应版本的段落作为发布说明
          VERSION="${{ github.ref_name }}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="FANDEX 三端 $VERSION 自动构建产物。

          - FANDEX-$VERSION.apk：新技术栈主线（React 生态三端统一）
          - FANDEX-Legacy-$VERSION.apk：旧技术栈归档线（Kotlin Compose 原生）
          - FANDEX-Setup-$VERSION.exe：Windows 桌面端安装包（Tauri 2，离线可用）
          - 两个 APK applicationId 不同，可并存安装"
          fi
          # 多行文本写入 GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传三端安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FANDEX ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            apk/FANDEX-${{ github.ref_name }}.apk
            apk/FANDEX-Legacy-${{ github.ref_name }}.apk
            apk/FANDEX-Setup-${{ github.ref_name }}.exe
            apk/FANDEX-Portable-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
