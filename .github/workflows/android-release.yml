# =============================================================================
# FANDEX 三端发布工作流
# =============================================================================
# 触发时机：
#   1. push v* 标签 → 自动构建并发布 GitHub Release
#   2. 手动触发（release=true） → 构建并发布指定标签的 Release
#
# 职责：版本一致性校验 → 三端并行构建（复用 android-build-reusable 与
#       desktop-build-reusable，产物保留 90 天并附便携版）→ 统一命名后
#       创建 GitHub Release，发布说明附带产物 SHA-256 校验值。
#
# 签名策略（两级回退，gradle 侧三级回退见 app-Android-new/app/build.gradle.kts）：
#   1. 配置以下 Secrets 时使用正式 keystore 签名——正式包之间签名一致，
#      应用内更新（PackageInstaller 覆盖安装）才能成功：
#        SIGNING_KEYSTORE_BASE64  ：fandex-release.jks 的 base64 文本
#                                   （本地生成：base64 -w0 fandex-release.jks）
#        FANDEX_KEYSTORE_PASSWORD ：keystore 密码
#        FANDEX_KEY_PASSWORD      ：key 密码
#        FANDEX_KEY_ALIAS         ：key 别名（可选，默认 fandex）
#   2. 未配置 Secrets 时回退 runner 临时 debug 签名，CI 可直接出包；
#      注意：每次运行的临时 key 都不同，仅可全新安装，无法覆盖升级
# =============================================================================

name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '构建并发布 Release（true 时需要当前提交有对应 v 前缀标签）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------
  # 版本一致性校验：tag 必须与各端版本号对齐，防止漏改版本号
  # -------------------------------------------------------
  version-check:
    name: 版本一致性校验
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 校验 tag 与各端版本号一致
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          fail() { echo "::error::$1"; exit 1; }
          gradle_ver() { sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$1"; }
          json_ver() { sed -n 's/.*"version": "\([^"]*\)".*/\1/p' "$1" | head -n1; }
          GRADLE_VER="$(gradle_ver app-Android-new/app/build.gradle.kts)"
          WEB_VER="$(json_ver app-web/package.json)"
          TAURI_VER="$(json_ver app-desktop/src-tauri/tauri.conf.json)"
          PORTABLE_VER="$(json_ver app-desktop-portable/package.json)"
          ROOT_VER="$(json_ver package.json)"
          echo "tag=$TAG_VER gradle=$GRADLE_VER web=$WEB_VER tauri=$TAURI_VER portable=$PORTABLE_VER root=$ROOT_VER"
          [ -n "$TAG_VER" ] || fail "标签名须为 vX.Y.Z 形式"
          [ "$GRADLE_VER" = "$TAG_VER" ] || fail "app-Android-new versionName（$GRADLE_VER）与 tag（$TAG_VER）不一致"
          [ "$WEB_VER" = "$TAG_VER" ] || fail "app-web version（$WEB_VER）与 tag（$TAG_VER）不一致"
          [ "$TAURI_VER" = "$TAG_VER" ] || fail "tauri.conf.json version（$TAURI_VER）与 tag（$TAG_VER）不一致"
          [ "$PORTABLE_VER" = "$TAG_VER" ] || fail "app-desktop-portable version（$PORTABLE_VER）与 tag（$TAG_VER）不一致"
          [ "$ROOT_VER" = "$TAG_VER" ] || fail "根 package.json version（$ROOT_VER）与 tag（$TAG_VER）不一致"
          echo "版本一致性校验通过"

  build:
    name: Android 双端构建
    needs: version-check
    uses: ./.github/workflows/android-build-reusable.yml
    with:
      retention-days: 90
    secrets: inherit

  desktop:
    name: Windows 桌面端构建
    needs: version-check
    uses: ./.github/workflows/desktop-build-reusable.yml
    with:
      retention-days: 90
      include-portable: true

  release:
    name: 发布 GitHub Release
    needs: [build, desktop]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库（读取 CHANGELOG 生成发布说明）
        uses: actions/checkout@v7

      - name: 下载新技术栈 APK 产物
        uses: actions/download-artifact@v8
        with:
          name: fandex-new-apk
          path: apk-new

      - name: 下载旧技术栈 APK 产物
        uses: actions/download-artifact@v8
        with:
          name: fandex-old-apk
          path: apk-old

      - name: 下载 Windows 桌面端安装包产物
        uses: actions/download-artifact@v8
        with:
          name: fandex-desktop-installer
          path: desktop

      - name: 下载 Windows 桌面端便携版产物
        uses: actions/download-artifact@v8
        with:
          name: fandex-desktop-portable
          path: desktop-portable

      - name: 重命名为发布文件名
        run: |
          mkdir -p dist
          mv apk-new/*.apk "dist/FANDEX-${{ github.ref_name }}.apk"
          mv apk-old/*.apk "dist/FANDEX-Legacy-${{ github.ref_name }}.apk"
          mv desktop/*.exe "dist/FANDEX-Setup-${{ github.ref_name }}.exe"
          mv desktop-portable/*.zip "dist/FANDEX-Portable-${{ github.ref_name }}.zip"
          ls -la dist/

      - name: 生成发布说明
        id: notes
        run: |
          # 优先取 CHANGELOG.md 中对应版本的段落作为发布说明
          VERSION="${{ github.ref_name }}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="FANDEX 三端 $VERSION 自动构建产物。

          - FANDEX-$VERSION.apk：新技术栈主线（React 生态三端统一）
          - FANDEX-Legacy-$VERSION.apk：旧技术栈归档线（Kotlin Compose 原生）
          - FANDEX-Setup-$VERSION.exe：Windows 桌面端安装包（Tauri 2，离线可用）
          - FANDEX-Portable-$VERSION.zip：Windows 桌面端便携版（免安装解压即用）
          - 两个 APK applicationId 不同，可并存安装"
          fi

          # 产物 SHA-256 摘要追加到发布说明（镜像分发场景校验完整性）
          DIGESTS="$(cd dist && sha256sum FANDEX-* | while read -r sum file; do echo "- \`${file}\` \`${sum}\`"; done)"
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo ""
            echo "### 产物 SHA-256 校验值"
            echo ""
            echo "$DIGESTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传三端安装包
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FANDEX ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/FANDEX-${{ github.ref_name }}.apk
            dist/FANDEX-Legacy-${{ github.ref_name }}.apk
            dist/FANDEX-Setup-${{ github.ref_name }}.exe
            dist/FANDEX-Portable-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
