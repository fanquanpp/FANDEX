# =============================================================================
# FANDEX Web 端 GitHub Pages 部署工作流
# =============================================================================
# 触发条件：
#   1. push 到 main 分支 → 构建并部署到 Pages
#   2. 指向 main 的 PR → 仅执行构建 + 类型检查 + QA 门禁，不部署
#   3. 手动触发 → 构建并部署到 Pages
#
# 构建流程：pnpm monorepo 安装 → 内容同步 + 内容审计 → 全仓类型检查
#           → app-web 构建 → QA 门禁 → 上传 artifact → 部署到 Pages
#
# 前置条件（仅需配置一次）：
#   仓库 Settings → Pages → Source → 选择 "GitHub Actions"
#
# 设计说明：
# - 使用自定义 workflow 而非 withastro/action，因为本项目是 pnpm monorepo，
#   pnpm-lock.yaml 位于仓库根目录，而 Astro 项目位于 app-web/ 子目录。
# - catalog 协议要求 pnpm 在根目录执行 install，子包通过 workspace 链接解析。
# - Node 版本固定 22（与 package.json engines 字段一致）。
# - pnpm 版本从 package.json packageManager 字段自动读取。
# =============================================================================

name: Deploy to GitHub Pages

on:
  # 推送到 main 分支时自动触发
  push:
    branches: [main]
    paths:
      - 'app-web/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  # 指向 main 的 PR 仅做构建校验（deploy 任务被 if 跳过）
  pull_request:
    branches: [main]
    paths:
      - 'app-web/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  # 允许从 Actions 面板手动触发
  workflow_dispatch:

# 权限配置：GitHub Pages 部署所需的最小权限集
permissions:
  contents: read          # 读取仓库代码
  pages: write            # 写入 Pages 部署
  id-token: write         # 生成 OIDC token 用于部署认证

# 并发控制：按 ref 分组。同一分支的新运行排队/取消旧的，不同 ref 之间互不干扰
# （若用字面量 group: pages，PR 校验运行与部署运行会共享队列，GitHub 会把
#  仍在排队的 push 部署运行按"同组仅保留最新"规则取消）。
# - main（push/dispatch）：cancel-in-progress=false，串行部署；
#   取消进行中的 Pages 部署会使部署进入孤立状态（官方模板同款配置）
# - PR：cancel-in-progress=true，PR 更新时自动取消过期的校验运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ========================================================
  # 构建任务：安装依赖、类型检查、构建 web 端、QA 门禁、上传产物
  # ========================================================
  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # 必须完整克隆：content-sync 依赖 git log 历史推导文档 updated 日期，
        # 浅克隆（默认 fetch-depth: 1）会让全部文档日期回退为构建当天，
        # 污染线上"最后更新"与 SEO 的 modifiedDate
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # 不指定 version，自动从 package.json packageManager 字段读取
        # 这确保 CI 与本地开发环境使用完全相同的 pnpm 版本

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm          # 启用 pnpm store 缓存，加速后续构建

      - name: Install dependencies
        # 使用 frozen-lockfile 确保依赖版本与 pnpm-lock.yaml 完全一致
        # CI 环境下禁止自动更新 lockfile，保证构建可复现
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (block on high severity)
        # 供应链门禁：生产依赖存在 high 及以上漏洞时阻断构建。
        # 本站为纯静态产物，构建链（vite/postcss 等）漏洞不随产物发布，
        # 故只审计 --prod 范围并以 high 为阈值，避免构建链噪音误伤
        run: pnpm -C app-web audit --prod --audit-level high

      - name: Sync content (auto-complete frontmatter & module registry)
        # 内容自动同步：补全 frontmatter 托管字段（order/module/category/updated 等）、
        # 注册新模块（含 module.json 反拆）、清理死链引用。零依赖，幂等；
        # 后续 typecheck/build 消费补全后的内容，作者无需手工维护元数据
        run: pnpm --filter @fandex/web sync

      - name: Content audit (block on HIGH severity issues)
        # 内容质量审计：正文长度、过时关键词、frontmatter 未知字段等 sync
        # 无法判断的问题；存在 HIGH 级问题时以非零退出码阻断构建与部署
        run: pnpm --filter @fandex/web exec node scripts/content-audit.mjs

      - name: Generate build stats baseline
        # doc-stats.json 被 gitignore，仅在构建期生成（本地 dev/build 均先跑此脚本）；
        # astro check 依赖该文件，因此 CI 中必须在 typecheck 之前生成
        run: pnpm --filter @fandex/web exec node scripts/build-stats.mjs

      - name: Typecheck
        # 全仓类型检查（app-web astro check + shd-shared/tokens + tls-tools）
        run: pnpm typecheck

      - name: Lint
        # ESLint（flat config）：src 的 TS/TSX（含 react-hooks 规则）与管线脚本；
        # 0 错误为通过（存量 exhaustive-deps 警告不阻断，待逐个人工评估）
        run: pnpm --filter @fandex/web lint

      - name: Build web project
        # 通过根目录 workspace 脚本构建 app-web 子包
        # 该命令会先执行 build-stats.mjs 生成统计信息，再执行 astro build
        run: pnpm build:web

      - name: Run web QA checks
        # 构建产物质量门禁：模块值一致性、幽灵目录、超大页面等
        # 任一 FAIL 项都会以非零退出码阻断部署
        run: pnpm --filter @fandex/web qa

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Astro 构建产物输出目录（app-web/dist/）
          path: app-web/dist

  # ========================================================
  # 部署任务：将构建产物发布到 GitHub Pages（PR 事件跳过）
  # ========================================================
  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
