
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app-web/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-web/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (block on high severity)
        run: pnpm -C app-web audit --prod --audit-level high

      - name: Sync content (auto-complete frontmatter & module registry)
        run: pnpm --filter @fandex/web sync

      - name: Content audit (block on HIGH severity issues)
        run: pnpm --filter @fandex/web exec node scripts/content-audit.mjs

      - name: Generate build stats baseline
        run: pnpm --filter @fandex/web exec node scripts/build-stats.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter @fandex/web lint

      - name: Build web project
        run: pnpm build:web

      - name: Run web QA checks
        run: pnpm --filter @fandex/web qa

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app-web/dist

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
