# =============================================================================
# FANDEX Windows 桌面端构建校验工作流
# =============================================================================
# 触发时机：
#   1. push 到 main 分支（桌面工程 / web 前端 / 内容源 / 共享层 / 工作流文件变更时）
#   2. 指向 main 的 PR（与 push 相同的路径过滤，PR 阶段即可发现构建回归）
#   3. 手动触发
#
# 职责：调用 desktop-build-reusable.yml 完成桌面端构建校验，
#       产物保留 14 天，不创建 Release（发布见 android-release.yml）。
# =============================================================================

name: Desktop Build Check

on:
  push:
    branches: [main]
    paths:
      - 'app-desktop/**'
      - 'app-web/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
      - '.github/workflows/desktop-build-reusable.yml'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app-desktop/**'
      - 'app-web/**'
      - 'cnt-content/**'
      - 'shd-shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
      - '.github/workflows/desktop-build-reusable.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  # 仅取消被 PR 新提交顶替的旧任务；push 到 main 时排队执行，
  # 避免连续合并时桌面校验被级联取消（每次合并都应得到最终验证结果）
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows 桌面端构建校验
    uses: ./.github/workflows/desktop-build-reusable.yml
    with:
      retention-days: 14
