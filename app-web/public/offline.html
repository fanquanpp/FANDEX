<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>离线状态 · FANDEX</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ebeff3;
      --surface: #f6f8fa;
      --fg: #1c2733;
      --fg-2: #5a6b7d;
      --accent: #14716a;
      --border: #c9d4de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0e14;
        --surface: #11161d;
        --fg: #dbe4ec;
        --fg-2: #8296a9;
        --accent: #39c5bb;
        --border: #232d38;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 24px;
    }
    .panel {
      max-width: 420px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 32px 28px;
    }
    .panel-index {
      font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--fg-2);
    }
    .panel h1 {
      margin: 10px 0 8px;
      font-size: 20px;
      letter-spacing: 0.04em;
    }
    .panel p {
      font-size: 13px;
      line-height: 1.7;
      color: var(--fg-2);
      margin-bottom: 20px;
    }
    .panel a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 16px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .panel a:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .panel a::before {
      content: '';
      width: 0;
      height: 0;
      border-block: 4px solid transparent;
      border-right: 6px solid currentColor;
    }
  </style>
  <script>
    // 界面语言跟随全局偏好（fandex-lang）：离线兜底页自包含，内联微型字典
    (function () {
      try {
        if (localStorage.getItem('fandex-lang') === 'en') {
          document.documentElement.setAttribute('lang', 'en');
          document.documentElement.setAttribute('data-lang', 'en');
          var h1 = document.querySelector('.panel h1');
          var p = document.querySelector('.panel p');
          var a = document.querySelector('.panel a');
          if (h1) h1.textContent = 'You are offline';
          if (p) p.textContent = 'No network connection and this page is not in the local cache. Pages you have visited still open offline; restore the network and use the button below to go back home.';
          if (a) a.textContent = 'Back to home';
        } else {
          document.documentElement.setAttribute('data-lang', 'zh');
        }
      } catch (e) {
        /* localStorage 不可用时保持中文 */
      }
    })();
  </script>
</head>
<body>
  <main class="panel">
    <span class="panel-index">ERR_NETWORK // OFFLINE</span>
    <h1>当前处于离线状态</h1>
    <p>无法连接到网络，且本地缓存中没有该页面。已访问过的页面在离线时仍可直接打开；恢复网络后点击下方按钮返回首页。</p>
    <a href="/FANDEX/">返回首页</a>
  </main>
</body>
</html>
