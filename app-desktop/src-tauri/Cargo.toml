[package]
name = "fandex-desktop"
version = "4.1.0"
description = "FANDEX 零基础全栈自学体系 Windows 桌面端"
authors = ["fanquanpp"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fandex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 桌面端发布构建：体积与运行性能平衡优化
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
